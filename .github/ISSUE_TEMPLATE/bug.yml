name: Bug report / 问题反馈
description: A reproducible problem with synthetic data / 使用合成数据复现问题
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and private Skill text. / 请移除密钥与私有技能原文。"
  - type: input
    id: environment
    attributes:
      label: Versions / 环境版本
      description: Spark, DSH, Node, operating system and browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic inputs / 步骤与合成输入
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
