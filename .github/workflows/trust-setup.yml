name: Trust setup

# One-off: registers this repository + publish.yml as a trusted publisher for
# dsh-plugin-spark on npm, then prints the resulting relationship. Deleted after
# the registration succeeds; the token it uses is the repository secret.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Add GitHub Actions as a trusted publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -y npm@12.2.2 trust github dsh-plugin-spark --file publish.yml --repo KratosLee-6/dsh-plugin-spark --allow-publish -y
      - name: List trusted publishers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -y npm@12.2.2 trust list dsh-plugin-spark --json
