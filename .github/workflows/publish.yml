name: Publish

# Publish to npm by pushing a version tag (v0.3.2) or by running this workflow
# manually. npm trusted publishing (OIDC) binds this workflow to the package on
# npmjs.com, so no long-lived token is involved: the job exchanges its GitHub
# OIDC identity for a short-lived publish credential.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The local lockfile resolves through registry.npmmirror.com; CI fetches
      # from npmjs because the mirror is unreliable from GitHub runners.
      npm_config_registry: https://registry.npmjs.org/
      npm_config_replace_registry_host: always
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here on purpose: it writes an `_authToken=${NODE_AUTH_TOKEN}`
      # line into .npmrc, and with the token absent npm authenticates with an empty
      # token instead of exchanging the GitHub OIDC identity for a trusted-publish one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@12
      - name: Show auth mode (no secret values)
        run: |
          echo "registry=$(npm config get registry)"
          echo "auth token configured: $(npm config get '//registry.npmjs.org/:_authToken' >/dev/null 2>&1 && echo yes || echo no)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "OIDC request URL: present"; else echo "OIDC request URL: MISSING"; fi
      - run: npm ci
      - run: npm run check
      - run: npm run verify:release
      - run: npm publish --provenance --access public --loglevel verbose
