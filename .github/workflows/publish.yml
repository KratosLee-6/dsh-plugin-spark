name: Publish

# Publish to npm by pushing a version tag (v0.3.2) or by running this workflow
# manually. npm trusted publishing (OIDC) binds this workflow to the package on
# npmjs.com, so no long-lived token is involved: the job exchanges its GitHub
# OIDC identity for a short-lived publish credential.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The local lockfile resolves through registry.npmmirror.com; CI fetches
      # from npmjs because the mirror is unreliable from GitHub runners.
      npm_config_registry: https://registry.npmjs.org/
      npm_config_replace_registry_host: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run check
      - run: npm run verify:release
      - run: npm publish --provenance --access public
